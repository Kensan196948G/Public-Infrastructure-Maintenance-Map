40	    - "!**/build/**"
41	    - "!**/node_modules/**"
42	    - "!**/vendor/**"
43	    - "!**/.next/**"
44	    - "!**/__pycache__/**"
45	    - "!**/coverage/**"
46	    - "!**/reports/**"
