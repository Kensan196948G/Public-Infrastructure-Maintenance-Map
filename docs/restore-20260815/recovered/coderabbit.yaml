51	    # 自動生成ドキュメントのみレビュー対象外（生成物。手書き .md / CLAUDE.md / SKILL.md は通常どおりレビューする）
52	    - "!**/CHANGELOG.md"
53	    - "!**/RELEASE_NOTES.md"
54	
55	  path_instructions:
56	    - path: "**/*.{ts,tsx,js,jsx}"
57	      instructions: |
58	        TypeScript / JavaScript レビュー観点:
59	        - 型安全 (any の濫用回避)
60	        - async/await の例外処理
61	        - Promise.all 化可能な逐次 await を指摘
62	        - hot path の JSON.parse/stringify を指摘
63	    - path: "**/*.py"
64	      instructions: |
65	        Python レビュー観点:
66	        - 型ヒント整合性
67	        - N+1 query / ループ内 I/O
68	        - context manager の漏れ
69	    - path: "**/*.go"
70	      instructions: |
71	        Go レビュー観点:
72	        - error wrap の徹底
73	        - goroutine leak と context cancellation
74	        - mutex の使い分け
75	    - path: ".claude/claudeos/scripts/hooks/**/*.js"
76	      instructions: |
77	        ClaudeOS hook レビュー観点:
78	        - fail-soft 設計の維持 (hook 失敗が本処理をブロックしない)
79	        - state.json への並列書き込み race 対策 (atomic write)
80	        - stdin から hookData JSON を読む際の壊れ JSON 耐性
81	    - path: "scripts/release/**/*.js"
82	      instructions: |
83	        release script レビュー観点:
84	        - git log / git tag の境界条件 (タグ無し / 履歴 0 件 / バイナリ差分)
85	        - 出力ファイルの上書きリスク (CHANGELOG.md は append のみ)
86	    - path: "**/SKILL.md"
87	      instructions: |
88	        Skill 文書レビュー観点:
89	        - 「使う場面」「想定入力」「期待する出力」が具体的か
90	        - 標準手順がチェックリストとして機能するか
91	    - path: "CLAUDE.md"
92	      instructions: |
93	        ClaudeOS ガバナンス文書レビュー観点:
94	        - §6 Agent ログフォーマットとアイコン規約の整合
95	        - §7 Issue Factory 生成条件の重複/曖昧排除
96	        - template ↔ root のドリフトを指摘
