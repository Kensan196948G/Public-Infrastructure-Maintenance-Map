1	# CodeRabbit プロジェクト設定 (ClaudeOS v8.2.5+)
2	# 配置先: 各登録プロジェクトの .coderabbit.yaml (リポジトリルート直下)
3	# ドキュメント: https://docs.coderabbit.ai/reference/configuration
4	
5	# レビュー対象言語（自動検出に加えて明示）
6	language: "ja-JP"
7	early_access: false
8	
9	reviews:
10	  profile: "chill"  # nitpicky に近いが過剰指摘を抑える
11	  request_changes_workflow: false
12	
13	  # 重大度別の対応規則を ClaudeOS §8.5 と揃える
14	  high_level_summary: true
15	  poem: false
16	  review_status: true
17	  collapse_walkthrough: false
18	
