# Cloudflare Workers deploy configuration.
# Secrets (DATABASE_URL) are set via `wrangler secret put` — never committed.
name = "pimm-api"
main = "src/worker.ts"
compatibility_date = "2026-07-01"
# Safe by default: a `wrangler deploy` that forgets --env production must not
# publish a reachable Worker. Without this, the workers.dev hostname would
# expose the admin API outside any Cloudflare Access application.
workers_dev = false

[vars]
# Local Vite dev origin — never "*". A deploy that forgets --env production
# must not publish a wildcard-CORS API (Issue #42 M-2).
ALLOWED_ORIGIN = "http://localhost:5173"
RATE_LIMIT_PER_MINUTE = "120"
# Enforced in every environment, so an accidental default-env deploy fails
# closed instead of falling back to the spoofable identity header.
REQUIRE_ACCESS_JWT = "true"

[observability]
enabled = true

[triggers]
# 自動取込スケジューラ（毎時実行）。実行対象は refresh_cron が現在時刻に一致する
# Worker 対応ソースのみ（W05 河川は大容量のため CLI 運用）。
crons = ["0 * * * *"]

[env.production]
name = "pimm-api-production"
# The workers.dev hostname is not covered by the Cloudflare Access application
# bound to the custom domain, so leaving it enabled would expose the admin API
# outside the authentication boundary.
workers_dev = false

[[env.production.routes]]
pattern = "api.pimm.mirai-dx-platform.com"
custom_domain = true

[env.production.vars]
ALLOWED_ORIGIN = "https://pimm.mirai-dx-platform.com"
RATE_LIMIT_PER_MINUTE = "120"
# Declared here rather than left to `wrangler secret put` so a forgotten or
# mistyped secret cannot silently downgrade production to sample data.
REQUIRE_DATABASE_URL = "true"
# Admin routes must reject every request unless a Cloudflare Access JWT is
# verified. Fails closed (500) if CLOUDFLARE_ACCESS_AUD / _TEAM_DOMAIN are unset.
REQUIRE_ACCESS_JWT = "true"

[env.production.triggers]
crons = ["0 * * * *"]
