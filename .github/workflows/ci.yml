name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: 🧪 Lint / Type / Test / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        # version is taken from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: 📦 Install
        run: pnpm install --frozen-lockfile

      - name: 🔍 Lint
        run: pnpm lint

      - name: 🧾 Format check
        run: pnpm format:check

      - name: 🔧 Typecheck
        run: pnpm typecheck

      - name: 🧪 Test
        run: pnpm test

      - name: 🏗️ Build
        run: pnpm build

  e2e:
    name: 🗺️ Playwright E2E
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        # version is taken from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: 📦 Install
        run: pnpm install --frozen-lockfile

      - name: 🌐 Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: 🗺️ Run E2E
        run: pnpm test:e2e

  postgres-integration:
    name: 🗄️ PostGIS integration

    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: pimm
          POSTGRES_PASSWORD: pimm
          POSTGRES_DB: pimm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pimm -d pimm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pimm:pimm@localhost:5432/pimm_test
      PIMM_RUN_POSTGRES_INTEGRATION: '1'
      PIMM_TEST_DATABASE_URL: postgresql://pimm:pimm@localhost:5432/pimm_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        # version is taken from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: 📦 Install
        run: pnpm install --frozen-lockfile

      - name: 🧱 Apply migrations
        run: pnpm db:migrate

      - name: 🗄️ Run PostGIS integration tests
        run: pnpm --filter @pimm/database test -- test/postgres.integration.test.ts

  publish-integration:
    name: 📤 Publish PostGIS integration
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: pimm
          POSTGRES_PASSWORD: pimm
          POSTGRES_DB: pimm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pimm -d pimm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pimm:pimm@localhost:5432/pimm_test
      PIMM_RUN_POSTGRES_PUBLISH_INTEGRATION: '1'
      PIMM_TEST_DATABASE_URL: postgresql://pimm:pimm@localhost:5432/pimm_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        # version is taken from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: 📦 Install
        run: pnpm install --frozen-lockfile

      - name: 🧱 Apply migrations
        run: pnpm db:migrate

      - name: 📤 Run publish integration tests
        run: pnpm --filter @pimm/database test -- test/publisher.integration.test.ts

  secret-scan:
    name: 🔐 Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: 📦 Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The osv-scanner-reusable.yml *reusable workflow* call consistently
      # failed at parse time (startup_failure, 0 jobs scheduled) for reasons
      # not surfaced by the Actions API. Using the underlying scanner action
      # directly as a normal step avoids that call mechanism entirely.
      - uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
