name: Production Smoke Monitor

on:
  schedule:
    # 15 分間隔の死活監視（外部監視の代替・第一層。通知は GitHub の
    # Actions 失敗通知を利用し、必要に応じて Slack/Teams 連携へ拡張する）
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-smoke-monitor
  cancel-in-progress: false

jobs:
  smoke:
    name: 🔭 Production smoke (/health/ready)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.10
        # setup-node の corepack 経由の pnpm 解決を避け、他 workflow と同一の
        # 初期化手順にする（2026-08-12 手動実行で setup-node が pnpm を
        # 見つけられず失敗したため）

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: 🔭 Run production smoke (monitor mode)
        id: smoke
        shell: bash
        run: |
          set -o pipefail
          node scripts/tools/cloudflare-production-smoke.mjs --monitor 2>&1 | tee smoke-result.log

      - name: 📝 Publish result to job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Production smoke: ${{ steps.smoke.outcome }}"
            echo '```'
            cat smoke-result.log 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📦 Keep failure evidence (90 days)
        if: failure() && steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-${{ github.run_id }}
          path: smoke-result.log
          retention-days: 90

      - name: 🚨 Open or update incident issue on failure
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          title="🚨 Production smoke monitor failing"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          failed=$(grep -E '^FAIL' smoke-result.log | head -20 || true)
          body=$(printf 'Failed run: %s\n\n```\n%s\n```\n' "$RUN_URL" "${failed:-see run log}")
          if [ -z "$number" ]; then
            gh issue create --title "$title" --label bug \
              --body "$(printf 'The scheduled production smoke started failing.\n\n%s\n\nThis issue auto-closes on the next successful run.' "$body")"
          else
            gh issue comment "$number" --body "$body"
          fi

      - name: ✅ Close incident issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          title="🚨 Production smoke monitor failing"
          for n in $(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Recovered: $RUN_URL"
          done
